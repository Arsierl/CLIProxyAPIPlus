name: branch-package

on:
  push:
    branches:
      - 'codex/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.0'
          cache: true

      - name: Generate Build Metadata
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo COMMIT=$(git rev-parse --short HEAD) >> $GITHUB_ENV
          echo BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) >> $GITHUB_ENV

      - name: Prepare Branch Release Metadata
        run: |
          BRANCH_SAFE=$(echo "${GITHUB_REF_NAME}" | tr '/._' '-' | tr -cd '[:alnum:]-' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-60)
          if [ -z "$BRANCH_SAFE" ]; then
            BRANCH_SAFE="branch"
          fi
          echo "BRANCH_SAFE=${BRANCH_SAFE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=branch-${BRANCH_SAFE}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Branch Build ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" >> $GITHUB_ENV
          {
            echo "RELEASE_BODY<<EOF"
            echo "Automated prerelease assets for branch testing."
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Built at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Build Snapshot Artifacts
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          COMMIT: ${{ env.COMMIT }}
          BUILD_DATE: ${{ env.BUILD_DATE }}

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyAPIPlus-${{ env.BRANCH_SAFE }}-${{ github.sha }}
          path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update Branch Prerelease
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          prerelease: true
          makeLatest: false
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          artifacts: "dist/checksums.txt,dist/*.tar.gz,dist/*.zip"
